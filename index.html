<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みんなの2択アプリ</title>
  <style>
    :root {
      color: #172033;
      background: #eef2ff;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    }

    main {
      width: min(560px, calc(100% - 32px));
      padding: 36px;
      box-sizing: border-box;
      background: white;
      border: 1px solid #e4e7f5;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgb(44 55 100 / 16%);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #665ee8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
    }

    .lead {
      margin: 12px 0 28px;
      color: #59627a;
    }

    #choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      border: 2px solid #d9def7;
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      color: inherit;
      font: inherit;
    }

    .choice:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .label {
      font-weight: 700;
    }

    .votes {
      color: #665ee8;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main>
    <h1>犬派ですか？猫派ですか？</h1>
    <p class="lead">あなたの好きなほうを選んでください。</p>
    <div id="choices">
      <button class="choice" type="button" disabled>
        <span class="label">犬派</span>
        <span class="votes">0票</span>
      </button>
      <button class="choice" type="button" disabled>
        <span class="label">猫派</span>
        <span class="votes">0票</span>
      </button>
    </div>
  </main>
</body>
</html>
