<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みんなの2択アプリ</title>
  <style>
    :root {
      color: #172033;
      background: #eef2ff;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    }

    main {
      width: min(560px, calc(100% - 32px));
      padding: 36px;
      box-sizing: border-box;
      background: white;
      border: 1px solid #e4e7f5;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgb(44 55 100 / 16%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
    }

    .lead {
      margin: 12px 0 28px;
      color: #59627a;
    }

    #choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      border: 2px solid #d9def7;
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      color: inherit;
      font: inherit;
    }

    .choice:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .label {
      font-weight: 700;
    }

    .votes {
      color: #665ee8;
      font-variant-numeric: tabular-nums;
    }

    #status {
      min-height: 1.5em;
      margin: 20px 0 0;
      color: #59627a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="question">読み込み中です...</h1>
    <p class="lead">あなたの好きなほうを選んでください。</p>
    <div id="choices"></div>
    <p id="status" role="status"></p>
  </main>

  <script>
    const API_URL = "https://xxxxxxxxxx.execute-api.us-east-1.amazonaws.com";

    const questionElement = document.querySelector("#question");
    const choicesElement = document.querySelector("#choices");
    const statusElement = document.querySelector("#status");

    async function callApi(path) {
      const response = await fetch(`${API_URL}${path}`);
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || "APIの呼び出しに失敗しました");
      }

      return data;
    }

    function renderPoll(poll) {
      questionElement.textContent = poll.question;
      choicesElement.replaceChildren();

      for (const choice of poll.choices) {
        const button = document.createElement("button");
        const label = document.createElement("span");
        const votes = document.createElement("span");

        button.type = "button";
        button.className = "choice";
        button.disabled = true;
        label.className = "label";
        votes.className = "votes";

        label.textContent = choice.label;
        votes.textContent = `${choice.votes}票`;

        button.append(label, votes);
        choicesElement.append(button);
      }
    }

    async function loadPoll() {
      try {
        const poll = await callApi("/poll");
        renderPoll(poll);
      } catch (error) {
        questionElement.textContent = "読み込みに失敗しました";
        statusElement.textContent = error.message;
      }
    }

    loadPoll();
  </script>
</body>
</html>
